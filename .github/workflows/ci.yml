name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest basedpyright
          # Textual is only needed by tui/, not by the server or storage tests.
          pip install "textual>=8"

      - name: pytest
        run: python -m pytest tests/ -q

      - name: basedpyright
        run: basedpyright

      - name: bash syntax (launcher)
        run: bash -n plexo
