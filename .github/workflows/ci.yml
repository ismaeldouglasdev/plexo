name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      # fail-fast:false evita abortar as legs irmas quando uma falha de verdade.
      # Nao evita leg cancelled: no free tier o runner 3.12 ja ficou 11min em
      # queued e voltou cancelled, deixando o CI vermelho sem nenhum teste
      # quebrado. Se isso repetir, baixe a matrix para so 3.14 em vez de
      # ficar caçando flaky.
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest basedpyright
          # Textual is only needed by tui/, not by the server or storage tests.
          pip install "textual>=8"

      - name: pytest
        run: python -m pytest tests/ -q

      - name: basedpyright
        run: basedpyright

      - name: bash syntax (launcher)
        run: bash -n plexo
